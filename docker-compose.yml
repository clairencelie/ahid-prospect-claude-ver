services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./db/migrations:/migrations
    entrypoint: ["migrate", "-path", "/migrations", "-database",
                 "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    restart: "no"

  seed:
    image: postgres:16-alpine
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-f", "/seed.sql"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BLOCK_THRESHOLD: ${BLOCK_THRESHOLD}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD}
      LOCK_TTL_DAYS: ${LOCK_TTL_DAYS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

  adminer:
    image: adminer
    ports: ["8081:8080"]

volumes:
  pgdata:
